<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Tracker</title>

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
</head>

<body>
  <!-- Bottom-left badge -->
  <div class="coming-soon">Google sign in COMING SOON</div>

  <main id="screens">
    <!-- WELCOME -->
    <section id="welcome" class="screen">
      <h1 class="title">Life Tracker</h1>
      <p class="hint">Enter your age and birthdate</p>

      <div class="controls">
        <input id="ageInput" type="number" min="1" max="130" placeholder="e.g. 19" />
        <input id="bdayInput" type="text" placeholder="MM/DD/YYYY" />
        <button id="startBtn" type="button">Enter</button>
      </div>

      <div id="errorMsg" class="hidden">Error enter your Birthdate pls</div>
      <small class="sub">A tiny pixel avatar will be created for you ✨</small>
    </section>

    <!-- SCENE -->
    <section id="scene" class="screen hidden">
      <!-- Fullscreen canvases -->
      <div class="stage" aria-hidden="true">
        <canvas id="bgCanvas"></canvas>
        <canvas id="characterCanvas"></canvas>
      </div>

      <!-- HUD overlay (stays put) -->
      <div class="hud">
        <button id="backBtn" class="hud-btn" type="button">← Back</button>

        <div class="countdown-box">
          <div class="countdown-line" id="bdayLabel">Birthdate: —</div>
          <div class="countdown-line" id="ageLabel">Age: —</div>
          <div class="countdown-big">
            <span id="daysLeft">—</span> days till your big day 🎉
          </div>
        </div>

        <div class="age-label" id="ageBadge">Age —</div>
      </div>

      <div class="bottom-right">Generated by Life Tracker • Pastel vibes</div>
    </section>
  </main>
</body>
</html>
