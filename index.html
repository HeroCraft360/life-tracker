<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
</head>

<body>
  <main id="screens">
    <!-- WELCOME SCREEN -->
    <section id="welcome" class="screen">
      <h1 class="title">Life Tracker</h1>
      <p class="hint">Enter your age and birthdate</p>

      <div class="controls">
        <input id="ageInput" type="number" min="1" max="130" placeholder="e.g. 19" />
        <input id="bdayInput" type="text" placeholder="MM/DD/YYYY" />
        <button id="startBtn">Enter</button>
      </div>

      <div id="errorMsg" class="hidden"></div>
      <small class="sub">A tiny pixel avatar will be created for you ✨</small>
    </section>

    <!-- SCENE SCREEN -->
    <section id="scene" class="screen hidden">
      <div class="topbar">
        <button id="backBtn">← Back</button>
        <div class="age-label" id="ageBadge">Age —</div>
      </div>

      <div class="countdown-box">
        <div class="countdown-line" id="bdayLabel">Birthdate: —</div>
        <div class="countdown-line" id="ageLabel">Age: —</div>
        <div class="countdown-big">
          <span id="daysLeft">—</span> days till your big day 🎉
        </div>
      </div>

      <div class="stage">
        <canvas id="bgCanvas" width="900" height="240" aria-hidden="true"></canvas>
        <canvas id="characterCanvas" width="240" height="240"></canvas>
      </div>

      <div class="bottom">
        Generated by Life Tracker • Pastel vibes
      </div>
    </section>
  </main>

  <!-- Bottom-left "coming soon" badge -->
  <div class="coming-soon">Google sign in COMING SOON</div>
</body>
</html>
